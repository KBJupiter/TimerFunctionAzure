name: Deploy Timer Function to Azure (Run From Package)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: func-timerfunction-demo001
  RESOURCE_GROUP: rg-Timerazurefirstfunction
  STORAGE_ACCOUNT_NAME: sttimerfuncdemo001
  CONTAINER_NAME: function-releases
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: '.'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore

      - name: Publish
        run: dotnet publish "${{ env.PROJECT_PATH }}" --configuration Release --output ./publish_output --no-build

      - name: Zip package
        run: |
          cd publish_output
          zip -r ../functionapp-${{ github.sha }}.zip .

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure blob container exists
        run: |
          az storage container create \
            --account-name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --name ${{ env.CONTAINER_NAME }} \
            --auth-mode login \
            --public-access off

      - name: Upload package to Blob Storage
        run: |
          az storage blob upload \
            --account-name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --container-name ${{ env.CONTAINER_NAME }} \
            --name functionapp-${{ github.sha }}.zip \
            --file functionapp-${{ github.sha }}.zip \
            --auth-mode login \
            --overwrite true

      - name: Generate read-only SAS URL for the package
        id: sas
        run: |
          EXPIRY=$(date -u -d "+6 days" '+%Y-%m-%dT%H:%MZ')
          SAS=$(az storage blob generate-sas \
            --account-name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --container-name ${{ env.CONTAINER_NAME }} \
            --name functionapp-${{ github.sha }}.zip \
            --permissions r \
            --expiry "$EXPIRY" \
            --auth-mode login \
            --as-user \
            --https-only \
            --output tsv)
          echo "package_url=https://${{ env.STORAGE_ACCOUNT_NAME }}.blob.core.windows.net/${{ env.CONTAINER_NAME }}/functionapp-${{ github.sha }}.zip?${SAS}" >> "$GITHUB_OUTPUT"

      - name: Point Function App at the package
        run: |
          az functionapp config appsettings set \
            --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --settings WEBSITE_RUN_FROM_PACKAGE="${{ steps.sas.outputs.package_url }}"

      - name: Restart Function App to pick up the new package
        run: |
          az functionapp restart \
            --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }}